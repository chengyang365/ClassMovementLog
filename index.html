<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <!-- PWA 核心 Meta 标签：强制全屏、隐藏浏览器UI、防止缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f1f5f9">
    <title>新廊华小出入系统</title>
    
    <!-- iOS 桌面图标 -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://em-content.zobj.net/source/apple/419/door_1f6aa.png">
    <link rel="apple-touch-icon" href="https://em-content.zobj.net/source/apple/419/door_1f6aa.png">

    <!-- 动态生成 PWA Manifest，实现“添加到主屏幕”变身原生 App -->
    <script>
        const manifestJSON = {
            "name": "新廊华小电子出入系统",
            "short_name": "出入系统",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f1f5f9",
            "theme_color": "#f1f5f9",
            "orientation": "landscape",
            "icons": [{"src": "https://raw.githubusercontent.com/chengyang365/ClassMovementLog/refs/heads/main/logo.png", "sizes": "192x192", "type": "image/png"}]
        };
        const manifestUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestJSON));
        document.write('<link rel="manifest" href="' + manifestUrl + '">');
    </script>
    
    <!-- 核心库 (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 样式 -->
    <style>
        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            overscroll-behavior-y: contain; /* 防止 iOS 橡皮筋下拉效果 */
        }
        
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(148, 163, 184, 0.8); }

        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.8); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn95 { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulseSoft { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); } }

        .animate-in { animation-duration: 0.4s; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .zoom-in-95 { animation-name: zoomIn95; }
        .slide-up { animation-name: slideUp; }
        .animate-pulse-soft { animation: pulseSoft 2s infinite; }
    </style>
</head>
<body class="text-slate-800 h-screen w-full overflow-hidden p-2 sm:p-4 md:p-6 select-none antialiased">

    <div id="root" class="w-full h-full max-w-[1920px] mx-auto"></div>

    <!-- React 应用逻辑 -->
    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYXYBnU5uzfzkM_F71KFxQyeTcNOTEeuQQaY6wgVmDCa5Leu0b_zZk5E5uC26vGD4pXQ/exec"; 

        // --- 组件 ---
        const DigitalClock = memo(() => {
            const [time, setTime] = useState(new Date());
            useEffect(() => { const timer = setInterval(() => setTime(new Date()), 1000); return () => clearInterval(timer); }, []);
            return (
                <div className="text-right shrink-0 flex flex-col justify-center">
                    <div className="text-2xl sm:text-4xl md:text-[2.5rem] font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 tracking-tight leading-none drop-shadow-sm">
                        {time.toLocaleTimeString('en-US', { hour12: true, hour: 'numeric', minute: '2-digit' })}
                    </div>
                    <div className="text-slate-500 font-medium text-[10px] sm:text-xs md:text-sm mt-1">
                        {time.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}
                    </div>
                </div>
            );
        });

        const Icon = ({ name, className, size = 24, ...props }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase());
                    containerRef.current.appendChild(i);
                    lucide.createIcons({ root: containerRef.current, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size, ...props } });
                }
            }, [name, className, size, JSON.stringify(props)]);
            return <span ref={containerRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
        };

        const parseName = (fullName) => {
            if (!fullName) return { cn: '', my: '' };
            const cnMatch = fullName.match(/[\u4e00-\u9fa5]+/g);
            const cn = cnMatch ? cnMatch.join('') : '';
            const my = fullName.replace(/[\u4e00-\u9fa5]+/g, '').replace(/[()（）]/g, '').replace(/\s+/g, ' ').trim();
            return { cn, my };
        };

        const TEACHERS = ["En Tan Hau Vind 陈皓运师", "En Yap Min Yan 叶民彦师", "Cik Ong Wen Jing 王文静师", "Pn Lee Yoke Yean 李育燕师", "Cik Oi Swee Chien 黄翠涓师", "Pn Rinny Seah Kwee Jean 佘桂仁师", "En Chong Cheng Yang 张政扬师", "Pn Tan Hui Kee 陈惠琪师", "Cik Nabila Binti Suhaimi", "Pn Chin Lee Mei 陈丽美师", "Pn Chiam Ai Ying 詹爱莹师", "En Winson Eng Wei Siang 黄伟祥师", "Cik Leong Siew Fern 梁筱芬师", "Cik Lim Sie Pei 林诗佩师", "Cik Tan Lee Ching 陈丽清师", "En Lim Kian Pin 林建品师", "En Willson Lim 林伟胜师", "Cik Lim Hui Ying 林卉颖师", "Cik Tay Sue Ching 郑淑琴师", "Pn Ngu Ling Houng 吴霖芳师", "Cik Heng Wui Sing 邢伟芯师", "Pn Koo Cheng Yee 古倩仪师", "Pn Ng Dong Yu 黄董宇师", "En Tan Sik Hong 陈实丰师", "Pn Lee Siow Mee 李晓梅师", "Pn Cher Ruey Ming 曹瑞敏师", "Pn Chua Chea Leng 蔡静玲师"];
        const TEACHER_CLASS_ORDER = ['3A', '3B', '3C', '3D', '3E', '4A', '4B', '4C', '4D', '5A', '5B', '5C', '5D', '5E', '6A', '6B', '6C', '1A', '1B', '1C', '1D', '1E', '2A', '2B', '2C', '2D', '2E'];
        
        const REASONS = [
            { id: 'tandas', label: '厕所', labelMy: 'Tandas', icon: '🚽', color: 'bg-gradient-to-br from-blue-50 to-blue-100/50 border-blue-200 text-blue-700 hover:shadow-md hover:border-blue-400' },
            { id: 'pejabat', label: '办公室', labelMy: 'Pejabat', icon: '🏢', color: 'bg-gradient-to-br from-purple-50 to-purple-100/50 border-purple-200 text-purple-700 hover:shadow-md hover:border-purple-400' },
            { id: 'guru', label: '见老师', labelMy: 'Jumpa Guru', icon: '👩‍🏫', color: 'bg-gradient-to-br from-orange-50 to-orange-100/50 border-orange-200 text-orange-700 hover:shadow-md hover:border-orange-400' },
            { id: 'lain', label: '其他', labelMy: 'Lain-lain', icon: '❓', color: 'bg-gradient-to-br from-slate-50 to-slate-100/50 border-slate-200 text-slate-700 hover:shadow-md hover:border-slate-400' }
        ];
        const PRESET_OTHER_REASONS = [
            { label: '图书馆', labelMy: 'Perpustakaan', icon: '📚' }, { label: '辅导室', labelMy: 'Bilik Kaunseling', icon: '🛋️' },
            { label: '医疗室', labelMy: 'Bilik Sakit', icon: '🚑' }, { label: '食堂', labelMy: 'Kantin', icon: '🍽️' },
            { label: '装水/洗手', labelMy: 'Isi Air/Basuh', icon: '🚰' }, { label: '拿东西', labelMy: 'Ambil Barang', icon: '🎒' }
        ];

        const generateDefaultClasses = () => {
            const structure = [{ level: 1, classes: ['A', 'B', 'C', 'D', 'E'] }, { level: 2, classes: ['A', 'B', 'C', 'D', 'E'] }, { level: 3, classes: ['A', 'B', 'C', 'D', 'E'] }, { level: 4, classes: ['A', 'B', 'C', 'D'] }, { level: 5, classes: ['A', 'B', 'C', 'D', 'E'] }, { level: 6, classes: ['A', 'B', 'C'] }];
            const teacherMap = {}; TEACHER_CLASS_ORDER.forEach((cls, i) => { if (TEACHERS[i]) teacherMap[cls] = TEACHERS[i]; });
            return structure.flatMap(g => g.classes.map(c => {
                const name = `${g.level}${c}`;
                return { id: name.toLowerCase(), name, teacher: teacherMap[name] || 'Guru Kelas', students: [] };
            }));
        };
        const DEFAULT_CLASSES = generateDefaultClasses();

        const syncToCloud = (payload) => {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_URL_HERE")) return;
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).catch(err => console.error("Cloud Sync Error:", err));
        };

        const UserAvatar = ({ name, size = "md", active = false }) => {
            const { cn, my } = parseName(name);
            let initials = "?";
            if (my && my.length > 0) initials = my.split(' ').slice(0, 2).map(n => n[0]).join('').toUpperCase();
            else if (cn && cn.length > 0) initials = cn[0];
            const colorIndex = name.length % 6;
            const colors = [
                'from-red-100 to-rose-200 text-rose-700', 'from-orange-100 to-amber-200 text-amber-700',
                'from-emerald-100 to-teal-200 text-teal-700', 'from-blue-100 to-cyan-200 text-blue-700',
                'from-indigo-100 to-violet-200 text-indigo-700', 'from-purple-100 to-fuchsia-200 text-purple-700'
            ];
            let sizeClass = "w-10 h-10 text-sm";
            if (size === "lg") sizeClass = "w-10 h-10 sm:w-12 sm:h-12 text-sm sm:text-lg";
            if (size === "sm") sizeClass = "w-8 h-8 text-xs";
            
            const colorClass = active ? "bg-white/20 text-white border border-white/40" : `bg-gradient-to-br ${colors[colorIndex]} shadow-inner border border-white/60`;
            return <div className={`${sizeClass} ${colorClass} rounded-full flex items-center justify-center font-bold shrink-0 transition-all duration-300`}>{initials}</div>;
        };

        function App() {
            const [classes, setClasses] = useState(DEFAULT_CLASSES);
            const [activeClassId, setActiveClassId] = useState(null); 
            const [view, setView] = useState('landing'); 
            const [logs, setLogs] = useState([]);
            const [attendanceData, setAttendanceData] = useState({}); 
            const [tempAbsentees, setTempAbsentees] = useState([]); 
            const [assignedClassIds, setAssignedClassIds] = useState([]); 
            
            const [selectedOutStudents, setSelectedOutStudents] = useState([]); 
            const [selectedReturnIds, setSelectedReturnIds] = useState([]); 
            const [showCustomReasonInput, setShowCustomReasonInput] = useState(false);
            const [customReasonText, setCustomReasonText] = useState('');
            const [globalModal, setGlobalModal] = useState(null); 
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [editingClass, setEditingClass] = useState(null); 
            const [statsView, setStatsView] = useState('monthly'); 
            const [statsTab, setStatsTab] = useState('overview'); 
            const [isExamMode, setIsExamMode] = useState(false); 
            const [mobileTab, setMobileTab] = useState('out'); 
            const [isLowAngleMode, setIsLowAngleMode] = useState(false);

            // 优化：将定时器刷新频率从 60 秒提升到 30 秒，让进度条更新更平滑
            const [minuteTicker, setMinuteTicker] = useState(Date.now());
            useEffect(() => { const timer = setInterval(() => setMinuteTicker(Date.now()), 30000); return () => clearInterval(timer); }, []);

            useEffect(() => {
                if (logs.length === 0) return;
                const now = new Date(); const todayStr = now.toLocaleDateString('en-CA'); const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const boundaries = [
                    { time: 9 * 60 + 30, label: '早上班下课' }, { time: 12 * 60 + 55, label: '早上班放学' },
                    { time: 15 * 60 + 30, label: '下午班下课' }, { time: 18 * 60 + 20, label: '下午班放学' }
                ];
                let hasUpdates = false;
                const updatedLogs = logs.map(log => {
                    if (log.timeIn) return log;
                    const outDate = new Date(log.timeOut); const isSameDay = outDate.toLocaleDateString('en-CA') === todayStr; const outMinutes = outDate.getHours() * 60 + outDate.getMinutes();
                    const nextBoundary = boundaries.find(b => outMinutes < b.time);
                    let shouldCheckout = false; let checkoutDate = null; let checkoutLabel = '';

                    if (!isSameDay) {
                        shouldCheckout = true; checkoutDate = new Date(outDate);
                        if (nextBoundary) { checkoutDate.setHours(Math.floor(nextBoundary.time / 60), nextBoundary.time % 60, 0, 0); checkoutLabel = `自动结账 (${nextBoundary.label})`; } 
                        else { checkoutDate.setMinutes(checkoutDate.getMinutes() + 30); checkoutLabel = `自动结账 (跨日)`; }
                    } else if (nextBoundary && currentMinutes >= nextBoundary.time) {
                        shouldCheckout = true; checkoutDate = new Date(now); checkoutDate.setHours(Math.floor(nextBoundary.time / 60), nextBoundary.time % 60, 0, 0); checkoutLabel = `自动结账 (${nextBoundary.label})`;
                    }
                    if (shouldCheckout) {
                        hasUpdates = true;
                        const dur = Math.round((checkoutDate - outDate)/60000) + ' min'; const timeInStr = checkoutDate.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true});
                        syncToCloud({ action: 'log_in', id: log.id, timeIn: timeInStr, duration: dur });
                        return { ...log, timeIn: checkoutDate.toISOString(), reasonDisplay: (log.reasonDisplay || log.reason) + ' - ' + checkoutLabel };
                    }
                    return log;
                });
                if (hasUpdates) setLogs(updatedLogs);
            }, [minuteTicker, logs]);

            useEffect(() => {
                try {
                    const savedClasses = localStorage.getItem('school_classes');
                    if (savedClasses) {
                        const parsedClasses = JSON.parse(savedClasses).map(c => ({ ...c, name: c.name.replace(/\s*\(\d{4}\)/, '') }));
                        setClasses(parsedClasses);
                    } else setClasses(DEFAULT_CLASSES);
                    const savedLogs = localStorage.getItem('school_logs'); if(savedLogs) setLogs(JSON.parse(savedLogs));
                    const savedAtt = localStorage.getItem('school_attendance'); if(savedAtt) setAttendanceData(JSON.parse(savedAtt));
                    const savedIds = localStorage.getItem('device_assigned_class_ids'); if(savedIds) setAssignedClassIds(JSON.parse(savedIds));
                    const savedExam = localStorage.getItem('school_exam_mode'); if(savedExam) setIsExamMode(JSON.parse(savedExam));
                    const savedLowAngle = localStorage.getItem('school_low_angle_mode'); if(savedLowAngle) setIsLowAngleMode(JSON.parse(savedLowAngle));
                } catch (error) { console.error("Load Error", error); }
            }, []);

            useEffect(() => { localStorage.setItem('school_classes', JSON.stringify(classes)); }, [classes]);
            useEffect(() => { localStorage.setItem('school_logs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('school_attendance', JSON.stringify(attendanceData)); }, [attendanceData]);
            useEffect(() => { localStorage.setItem('school_exam_mode', JSON.stringify(isExamMode)); }, [isExamMode]);
            useEffect(() => { localStorage.setItem('device_assigned_class_ids', JSON.stringify(assignedClassIds)); }, [assignedClassIds]);
            useEffect(() => { localStorage.setItem('school_low_angle_mode', JSON.stringify(isLowAngleMode)); }, [isLowAngleMode]);

            const getActiveClass = () => classes.find(c => c.id === activeClassId);
            const formatTime = (dateObj) => dateObj ? new Date(dateObj).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) : '-';
            const formatDate = (dateObj) => new Date(dateObj).toLocaleDateString('en-GB');
            const getTodayString = () => new Date().toLocaleDateString('en-CA'); 
            const getCurrentAbsentees = (classId) => { const record = attendanceData[classId]; return (record && record.date === getTodayString()) ? (record.absent || []) : []; };

            const fetchStudentsFromCloud = async () => {
                if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_URL_HERE")) return setGlobalModal({ type: 'alert', title: '未设置 URL', message: '请在代码中填入 Google Apps Script URL', isDanger: true });
                if (assignedClassIds.length === 0) return setGlobalModal({ type: 'alert', title: '未绑定班级', message: '请先在系统管理中绑定班级，再进行同步。', isDanger: true });
                setGlobalModal({ type: 'alert', title: '同步中...', message: '正在从 Google Sheet 下载已绑定班级的学生名单...\nSedang memuat turun senarai nama...' });
                try {
                    const res = await fetch(GOOGLE_SCRIPT_URL); const cloudData = await res.json();
                    if(cloudData.error) throw new Error(cloudData.error);
                    const newClasses = classes.map(c => {
                        if (assignedClassIds.includes(c.id)) {
                            const shortName = c.name.split(' ')[0]; const cloudList = cloudData[shortName] || cloudData[c.name];
                            if (cloudList && Array.isArray(cloudList)) return { ...c, students: cloudList };
                        }
                        return c;
                    });
                    setClasses(newClasses);
                    setGlobalModal({ type: 'alert', title: '成功 / Berjaya', message: '已绑定班级的名单更新完毕！\nSenarai murid telah dikemaskini.', confirmText: 'OK' });
                } catch (e) { setGlobalModal({ type: 'alert', title: '失败 / Gagal', message: '同步失败，请检查网络或 Sheet 设置。\n' + e.message, isDanger: true }); }
            };

            const handleEnterClass = (classId) => { setActiveClassId(classId); setSelectedOutStudents([]); setSelectedReturnIds([]); setView('dashboard'); setMobileTab('out'); };
            const handleAdminLogin = () => { if (adminPasswordInput === "1234") { setView('admin'); setShowAdminLogin(false); setAdminPasswordInput(''); } else { setGlobalModal({ type: 'alert', title: '错误', message: '密码不正确', isDanger: true }); } };
            const toggleStudentSelection = (name) => {
                const isOut = logs.find(log => log.classId === activeClassId && log.name === name && !log.timeIn);
                if(isOut) return; 
                if(selectedOutStudents.includes(name)) setSelectedOutStudents(prev => prev.filter(n => n !== name));
                else setSelectedOutStudents(prev => [...prev, name]);
            };
            const toggleTempAbsent = (name) => { if(tempAbsentees.includes(name)) setTempAbsentees(prev=>prev.filter(n=>n!==name)); else setTempAbsentees(prev=>[...prev, name]); };

            const executeExit = (reasonObj, specificText='') => {
                if (selectedOutStudents.length === 0) return;
                const finalReason = specificText ? `${reasonObj.label} (${specificText})` : reasonObj.label;
                const now = new Date();
                const newLogs = selectedOutStudents.map((name, i) => {
                    const logId = Date.now() + i + Math.random();
                    syncToCloud({ action: 'log_out', id: logId, date: now.toLocaleDateString('en-GB'), timeOut: now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true}), className: getActiveClass().name, name: name, reason: finalReason });
                    return { id: logId, classId: activeClassId, date: now.toISOString(), name: name, timeOut: now.toISOString(), timeIn: null, reason: reasonObj.label, reasonDisplay: finalReason, reasonId: reasonObj.id };
                });
                setLogs([...newLogs, ...logs]); setSelectedOutStudents([]); setShowCustomReasonInput(false); setCustomReasonText(''); setMobileTab('in');
            };

            const handleConfirmExit = (reasonObj) => { if (reasonObj.id === 'lain') { setShowCustomReasonInput(true); return; } executeExit(reasonObj); };
            const submitCustomReason = () => { const lainReasonObj = REASONS.find(r => r.id === 'lain'); executeExit(lainReasonObj, customReasonText); };

            const handleStudentReturn = (id) => {
                const now = new Date();
                const updatedLogs = logs.map(log => {
                    if (log.id === id) {
                        const dur = Math.round((now - new Date(log.timeOut))/60000) + ' min'; const timeInStr = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true});
                        syncToCloud({ action: 'log_in', id: id, timeIn: timeInStr, duration: dur });
                        return { ...log, timeIn: now.toISOString() };
                    }
                    return log;
                });
                setLogs(updatedLogs); 
                if (logs.filter(log => log.classId === activeClassId && !log.timeIn).length <= 1) setMobileTab('out');
            };

            const handleSaveAttendance = (list) => {
                const today = getTodayString(); setAttendanceData(prev => ({...prev, [activeClassId]: {date: today, absent: list}}));
                syncToCloud({ action: 'save_attendance', className: getActiveClass().name, absentList: list });
                setGlobalModal({ type:'alert', title:'成功', message:'点名已保存并同步。', onConfirm: ()=>setView('dashboard') });
            };

            const handleExportData = () => {
                const data = { classes, logs, attendanceData, assignedClassIds, isExamMode, backupDate: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `SJKC_Log_Backup_${getTodayString()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };

            const handleExportClassLogsCSV = () => {
                const cls = getActiveClass(); if (!cls) return;
                const classLogs = logs.filter(log => log.classId === activeClassId);
                let csvContent = "Date,Name,Time Out,Time In,Reason,Duration (Min)\n";
                classLogs.forEach(log => {
                    const duration = log.timeIn ? Math.round((new Date(log.timeIn) - new Date(log.timeOut)) / 1000 / 60) : '';
                    csvContent += `${formatDate(log.date)},"${log.name}",${formatTime(log.timeOut)},${formatTime(log.timeIn) || 'Still Out'},"${log.reasonDisplay || log.reason}",${duration}\n`;
                });
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob);

                    const dayLabel = days[date.getDay()];
                    if (!agg.dayOfWeek[dayLabel]) agg.dayOfWeek[dayLabel] = 0;
                    agg.dayOfWeek[dayLabel]++;
                    if (log.timeIn) { 
                        let dur = (new Date(log.timeIn) - timeOut) / 1000 / 60; 
                        const isAbnormal = dur > 180; if (isAbnormal) dur = 30; 
                        agg.duration.total += dur; agg.duration.count++; 
                        if (dur > 20 && !isAbnormal) { agg.duration.longOut.push({ ...log, duration: Math.round(dur) }); }
                    }
                });
                const sortedOverviewKeys = Object.keys(agg.overview).sort().reverse();

                return (
                    <div className="h-full flex flex-col glass-panel rounded-2xl sm:rounded-[2rem] shadow-lg overflow-hidden animate-in fade-in duration-300">
                        <div className="bg-white/60 p-4 sm:p-5 flex justify-between items-center shrink-0 border-b border-white">
                            <div className="flex items-center gap-3 sm:gap-4">
                                <button onClick={() => setView('dashboard')} className="bg-white hover:bg-slate-50 p-2.5 rounded-xl transition-all shadow-sm border border-slate-200 text-slate-500"><Icon name="arrow-left" size={24} /></button>
                                <div><h2 className="text-lg sm:text-xl font-black text-slate-800">统计分析</h2><p className="text-slate-500 text-xs sm:text-sm font-medium">Statistik - {cls?.name}</p></div>
                            </div>
                            <div className="flex gap-2 overflow-x-auto custom-scrollbar p-1">
                               <button onClick={() => setStatsTab('overview')} className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition-all ${statsTab === 'overview' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}><Icon name="bar-chart-3" size={16}/> 概览</button>
                               <button onClick={() => setStatsTab('duration')} className={`px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 whitespace-nowrap transition-all ${statsTab === 'duration' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}><Icon name="timer" size={16}/> 时长</button>
                            </div>
                        </div>
                        <div className="flex-grow overflow-auto p-4 sm:p-6 custom-scrollbar">
                           {classLogs.length === 0 ? <div className="h-full flex flex-col items-center justify-center text-slate-400 opacity-60"><Icon name="bar-chart-3" size={64} className="mb-4 text-slate-300" /><p className="text-xl font-bold">暂无统计数据</p></div> : (
                             <React.Fragment>
                               {statsTab === 'overview' && (
                                 <React.Fragment>
                                    <div className="flex justify-end mb-6"><div className="bg-white/80 p-1.5 rounded-xl flex shadow-sm border border-slate-200"><button onClick={() => setStatsView('monthly')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${statsView === 'monthly' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>月度</button><button onClick={() => setStatsView('yearly')} className={`px-4 py-1.5 rounded-lg text-sm font-bold transition-all ${statsView === 'yearly' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>年度</button></div></div>
                                    <div className="space-y-6">
                                        {sortedOverviewKeys.map(key => {
                                            const data = agg.overview[key]; const sortedStudents = Object.entries(data.students).sort((a,b) => b[1] - a[1]).slice(0, 5);
                                            return (
                                              <div key={key} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                                 <div className="flex justify-between items-end mb-6 border-b border-slate-100 pb-4"><div><h3 className="text-2xl font-black text-slate-800">{data.label}</h3><p className="text-slate-500 text-sm font-medium">{data.labelMy}</p></div><div className="text-right"><div className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">{data.total}</div><div className="text-xs text-slate-400 font-bold uppercase tracking-widest mt-1">Total Logs</div></div></div>
                                                 <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                    <div><h4 className="font-bold text-slate-700 mb-4 text-sm flex items-center gap-2"><Icon name="pie-chart" size={18} className="text-indigo-400"/> 原因分布</h4><div className="space-y-3">{REASONS.map(r => (<div key={r.id} className="flex items-center text-xs"><div className="w-20 text-slate-500 font-medium">{r.label}</div><div className="flex-grow bg-slate-100 h-2.5 rounded-full overflow-hidden"><div className="bg-gradient-to-r from-blue-400 to-indigo-500 h-full rounded-full" style={{width: `${(data.reasons[r.id]||0)/data.total*100}%`}}></div></div><div className="w-10 text-right font-bold text-slate-700">{data.reasons[r.id]||0}</div></div>))}</div></div>
                                                    <div><h4 className="font-bold text-slate-700 mb-4 text-sm flex items-center gap-2"><Icon name="users" size={18} className="text-blue-400"/> 高频外出学生 (Top 5)</h4><div className="space-y-2">{sortedStudents.map(([name, count], i) => (<div key={name} className="flex justify-between items-center text-xs bg-slate-50 p-2.5 rounded-lg border border-slate-100"><span className="font-bold text-slate-700 truncate"><span className="text-slate-400 mr-2">#{i+1}</span>{name}</span><span className="font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{count}次</span></div>))}</div></div>
                                                 </div>
                                              </div>
                                            );
                                        })}
                                    </div>
                                 </React.Fragment>
                               )}
                               {statsTab === 'duration' && (
                                 <div className="space-y-6">
                                     <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                         <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center py-10"><div className="bg-gradient-to-br from-amber-100 to-orange-100 p-4 rounded-2xl text-orange-600 mb-4 shadow-inner"><Icon name="timer" size={40} /></div><div className="text-5xl font-black text-slate-800 mb-2">{agg.duration.count > 0 ? Math.round(agg.duration.total / agg.duration.count) : 0} <span className="text-xl font-medium text-slate-400">min</span></div><div className="text-slate-500 font-bold text-base">平均每次外出时长</div></div>
                                         <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center py-10"><div className="bg-gradient-to-br from-red-100 to-rose-100 p-4 rounded-2xl text-rose-600 mb-4 shadow-inner"><Icon name="alert-octagon" size={40} /></div><div className="text-5xl font-black text-slate-800 mb-2">{agg.duration.longOut.length} <span className="text-xl font-medium text-slate-400">次</span></div><div className="text-slate-500 font-bold text-base">超时记录 ({'>'}20分钟)</div></div>
                                     </div>
                                     <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                         <h4 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Icon name="clock" className="text-rose-400 w-5 h-5"/> 严重超时详情 (前 10 条)</h4>
                                         <div className="overflow-x-auto custom-scrollbar">
                                             <table className="w-full text-left text-sm min-w-[400px]">
                                                 <thead className="bg-slate-50 text-slate-500 border-b border-slate-100"><tr><th className="p-3">学生</th><th className="p-3">原因</th><th className="p-3">时间</th><th className="p-3">时长</th></tr></thead>
                                                 <tbody className="divide-y divide-slate-100">{agg.duration.longOut.length === 0 ? (<tr><td colSpan={4} className="p-6 text-center text-slate-400 font-medium">暂无超时记录，表现很好！</td></tr>) : (agg.duration.longOut.slice(0,10).map(l => (<tr key={l.id} className="hover:bg-rose-50/30"><td className="p-3 font-bold text-slate-700">{l.name}</td><td className="p-3 text-slate-500">{l.reasonDisplay || l.reason}</td><td className="p-3 text-slate-400 font-mono text-xs">{formatDate(l.date)}</td><td className="p-3 font-black text-rose-500">{l.duration} min</td></tr>)))}</tbody>
                                             </table>
                                         </div>
                                     </div>
                                 </div>
                               )}
                             </React.Fragment>
                           )}
                        </div>
                    </div>
                );
            };

            const renderAdmin = () => (
                <div className="h-full flex flex-col animate-in fade-in duration-300">
                    <div className="glass-panel p-4 sm:p-5 flex justify-between items-center shrink-0 mb-4 rounded-2xl sm:rounded-[2rem] shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] border-white">
                        <h2 className="text-lg sm:text-2xl font-black flex items-center gap-2 sm:gap-3 text-slate-800"><Icon name="settings" size={24} className="text-indigo-500" /> SJK(C) Ladang Grisek <span className="hidden sm:inline">| 系统管理</span></h2>
                        <button onClick={() => setView('landing')} className="bg-white hover:bg-slate-50 border border-slate-200 px-5 py-2.5 rounded-xl text-sm font-bold shadow-sm transition-all text-slate-600 active:scale-95">返回首页</button>
                    </div>
                    
                    <div className="flex-grow overflow-y-auto custom-scrollbar pb-6">
                        {!editingClass ? (
                            <div className="max-w-5xl mx-auto space-y-6 sm:space-y-8">
                                {/* 1. 系统功能卡片 */}
                                <div className="glass-panel rounded-2xl sm:rounded-[2rem] p-6 sm:p-8 border-white/60 shadow-sm">
                                    <h3 className="text-xl font-black text-slate-800 flex items-center gap-2 mb-6"><Icon name="layout-dashboard" size={20} className="text-blue-500" /> 控制面板</h3>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="flex justify-between items-center p-4 bg-white/80 rounded-2xl border border-slate-200 shadow-sm">
                                            <div className="flex gap-4 items-center">
                                                <div className="p-3 bg-red-100 text-red-600 rounded-xl shadow-inner"><Icon name="lock" size={20} /></div>
                                                <div><div className="font-bold text-slate-800">考试模式</div><div className="text-xs text-slate-500">开启后将锁定全校的登记功能</div></div>
                                            </div>
                                            <button onClick={()=>{setIsExamMode(!isExamMode); setGlobalModal({type:'alert', title:'成功', message:'设置已生效'})}} className={`px-5 py-2.5 rounded-xl font-bold transition-all shadow-sm ${isExamMode?'bg-gradient-to-r from-red-500 to-rose-600 text-white shadow-red-500/30':'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{isExamMode?'已锁定':'未开启'}</button>
                                        </div>

                                        <div className="flex justify-between items-center p-4 bg-white/80 rounded-2xl border border-slate-200 shadow-sm">
                                            <div className="flex gap-4 items-center">
                                                <div className="p-3 bg-indigo-100 text-indigo-600 rounded-xl shadow-inner"><Icon name="monitor" size={20} /></div>
                                                <div><div className="font-bold text-slate-800">设备绑定</div><div className="text-xs text-slate-500">选择此大屏负责的班级</div></div>
                                            </div>
                                            <select onChange={(e)=>{if(e.target.value) handleAssignClass(e.target.value); e.target.value='';}} className="p-2.5 border border-slate-200 bg-slate-50 rounded-xl text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                                                <option value="">+ 添加绑定...</option>
                                                {classes.map(c => <option key={c.id} value={c.id} disabled={assignedClassIds.includes(c.id)}>{c.name}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    {assignedClassIds.length > 0 && (
                                        <div className="mt-4 p-4 bg-indigo-50/50 rounded-2xl border border-indigo-100/50 flex flex-wrap gap-2 items-center">
                                            <span className="text-xs font-bold text-indigo-400 mr-2">当前已绑定设备:</span>
                                            {assignedClassIds.map(id => { const c = classes.find(x=>x.id===id); return c ? <span key={id} onClick={()=>handleUnassignClass(id)} className="px-3 py-1.5 bg-white text-indigo-700 border border-indigo-200 rounded-lg text-sm font-bold flex gap-2 items-center cursor-pointer shadow-sm hover:bg-red-50 hover:text-red-600 hover:border-red-200 transition-colors group">{c.name} <Icon name="x" size={14} className="text-indigo-300 group-hover:text-red-400" /></span> : null; })}
                                        </div>
                                    )}

                                    <div className="flex gap-3 pt-6 mt-6 border-t border-slate-200/60">
                                        <button onClick={handleExportData} className="flex-1 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-50 flex justify-center items-center gap-2 shadow-sm transition-all active:scale-95"><Icon name="download" size={18} /> 完整数据备份</button>
                                        <label className="flex-1 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-700 hover:bg-slate-50 flex justify-center items-center gap-2 shadow-sm cursor-pointer transition-all active:scale-95"><Icon name="upload" size={18} /> 恢复备份存档<input type="file" className="hidden" onChange={handleImportData}/></label>
                                    </div>
                                </div>

                                {/* 2. 班级列表卡片 */}
                                <div className="glass-panel rounded-2xl sm:rounded-[2rem] p-6 sm:p-8 border-white/60 shadow-sm">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                        <h3 className="text-xl font-black text-slate-800 flex items-center gap-2"><Icon name="users" size={20} className="text-emerald-500" /> 班级名单管理</h3>
                                        <div className="flex gap-2 w-full sm:w-auto">
                                            <button onClick={fetchStudentsFromCloud} className="flex-1 sm:flex-none bg-amber-100 hover:bg-amber-200 text-amber-700 px-4 py-2.5 rounded-xl font-bold flex justify-center items-center gap-2 text-sm transition-colors shadow-sm border border-amber-200/50">
                                                <Icon name="cloud-download" size={16} /> <span>同步云端名单</span>
                                            </button>
                                            <button onClick={handleAddClass} className="flex-1 sm:flex-none bg-slate-800 hover:bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold flex justify-center items-center gap-2 text-sm transition-colors shadow-md active:scale-95"><Icon name="plus" size={16} /> 添加班级</button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {classes.filter(cls => assignedClassIds.includes(cls.id)).length === 0 ? (
                                            <div className="col-span-full text-center p-10 bg-white/50 rounded-2xl border-2 border-dashed border-slate-300 text-slate-500 font-medium">
                                                尚未绑定班级。请在上方“设备绑定”中选择班级，或点击添加。
                                            </div>
                                        ) : (
                                            classes.filter(cls => assignedClassIds.includes(cls.id)).map(cls => (
                                                <div key={cls.id} className="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 flex justify-between items-center group hover:border-indigo-300 hover:shadow-md transition-all">
                                                    <div className="min-w-0 pr-3">
                                                        <div className="font-black text-lg text-slate-800 truncate">{cls.name}</div>
                                                        <div className="text-slate-500 text-xs font-medium truncate mt-1 bg-slate-100 inline-block px-2 py-0.5 rounded-md">{cls.teacher} • {cls.students.length} 人</div>
                                                    </div>
                                                    <div className="flex gap-2 shrink-0 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                        <button onClick={() => setEditingClass(cls)} className="p-2 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 transition-colors"><Icon name="pen-tool" size={16} /></button>
                                                        <button onClick={() => handleDeleteClass(cls.id)} className="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-colors"><Icon name="trash-2" size={16} /></button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="max-w-3xl mx-auto glass-panel rounded-[2rem] shadow-xl border-white p-6 sm:p-8 animate-in zoom-in-95">
                                <h3 className="text-2xl font-black text-slate-800 mb-6 border-b border-slate-200 pb-4">编辑班级: <span className="text-indigo-600">{editingClass.name}</span></h3>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                                    <div><label className="block text-sm font-bold text-slate-500 mb-2">班级名称 (例如: 1A)</label><input value={editingClass.name} onChange={e=>setEditingClass({...editingClass, name:e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl font-bold focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm"/></div>
                                    <div><label className="block text-sm font-bold text-slate-500 mb-2">班主任姓名</label><input value={editingClass.teacher} onChange={e=>setEditingClass({...editingClass, teacher:e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl font-bold focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm"/></div>
                                </div>

                                <div className="mb-6">
                                    <div className="flex justify-between items-end mb-2">
                                        <label className="block text-sm font-bold text-slate-500">学生名单 <span className="text-xs font-normal">(一行一个名字)</span></label>
                                        <label className="text-indigo-600 font-bold text-xs bg-indigo-50 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-indigo-100 flex items-center gap-1.5 transition-colors border border-indigo-100"><Icon name="upload" size={14} /> 批量导入 CSV<input type="file" className="hidden" onChange={handleImportStudentCSV}/></label>
                                    </div>
                                    <textarea value={editingClass.students.join('\n')} onChange={e=>setEditingClass({...editingClass, students:e.target.value.split('\n')})} className="w-full h-64 p-4 bg-white border border-slate-200 rounded-xl font-mono text-sm resize-none focus:ring-2 focus:ring-indigo-500 outline-none custom-scrollbar shadow-inner" placeholder="Ali bin Abu&#10;Tan Xiao Ming&#10;..."></textarea>
                                    <p className="text-right text-xs font-bold text-slate-400 mt-2">共计: {editingClass.students.filter(s=>s.trim()).length} 名学生</p>
                                </div>

                                <div className="flex gap-4">
                                    <button onClick={() => setEditingClass(null)} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">取消修改</button>
                                    <button onClick={() => { handleSaveClass(editingClass); setEditingClass(null); }} className="flex-1 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-bold hover:from-blue-500 hover:to-indigo-500 shadow-lg shadow-indigo-500/30 transition-all active:scale-95 flex items-center justify-center gap-2"><Icon name="save" size={18}/> 保存班级</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="w-full h-full relative">
                    {view === 'landing' && renderLanding()}
                    {view === 'admin' && renderAdmin()}
                    {view === 'dashboard' && renderDashboard()}
                    {view === 'history' && renderHistory()}
                    {view === 'attendance' && renderAttendance()}
                    {view === 'statistics' && renderStatistics()}
                    {renderGlobalModal()}
                    {renderCustomReasonModal()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
